version: 1

regions:
  - id: core
    name: Core
    start: 0x00000000
    size: 192K
    children:
      - { id: dbg,  start: 0x00000000 ,name: Debug,              size: 4K  }
      - { id: imem, start: 0x00010000 ,name: Instruction Memory, size: 64K }
      - { id: dmem, start: 0x00020000 ,name: Data Memory,        size: 64K }
