[package]
name = "zeroheti-bsp"
version = "0.1.0"
edition = "2024"

[dependencies]
zeroheti-bsp-macros = { path = "macros"}
embedded-io = "0.7.1"
fugit = "0.3.7"
riscv = { version = "0.16.0", features = ["rt"] }
riscv-peripheral = "0.5.0"
riscv-types = "0.1.0"
# riscv-rt=0.18.0 depends on riscv=0.16.0
riscv-rt = { version = "0.18.0", features = ["single-hart", "v-trap", "custom-interrupts", "custom-setup-interrupts"], optional = true }
strum = { version = "0.27.2", default-features = false, features = ["derive"] }
ufmt = { version = "0.2.0", optional = true }
embedded-hal = { version = "1.0.0", optional = true }
bitflags = "2.11.0"

[features]
default = ["panic", "rt", "core-fmt", "nest-continue", "default-trap-print"]
core-fmt = []
ufmt = ["dep:ufmt"]
rtl-tb = []
fpga = []
panic = []
rt = ["dep:riscv-rt"]
nest-continue = []
intc-hetic = []
intc-clic = []
intc-edfic = []
embedded-hal = ["dep:embedded-hal"]
default-trap-print = []

[profile.dev]
# There seems to be a problem in riscv-rt with regards to linking in default_start_trap in debug
# mode. `codegen-units = 1` avoids that
codegen-units = 1
opt-level = "s"

[profile.release]
debug = true

[build-dependencies]
riscv-target-parser = "0.1.3"

[[example]]
name = "hetic_pend"
path = "examples/hetic_pend.rs"
required-features = ["intc-hetic"]

[[example]]
name = "all_irqs"
path = "examples/all_irqs.rs"
