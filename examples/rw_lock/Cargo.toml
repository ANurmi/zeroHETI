[package]
name = "rw_lock"
version = "0.1.0"
edition = "2024"

[dependencies]
bsp = { package = "zeroheti-bsp", path = "../zeroheti-bsp", features = [
    "rt",
] }
# Required if riscv-macros::core_interrupt is used. riscv-rt version must align with BSP
riscv-rt = { version = "0.18.0" }
rtic = { version = "0.1.0", path = "../mrtic/distributions/zeroheti-rtic", features = ["rtl-tb", "obs"] }

[features]
default = []

intc-clic = ["bsp/intc-clic", "rtic/intc-clic"]
intc-edfic = ["bsp/intc-edfic", "rtic/intc-edfic"]

# Use this feature when using cosimulators such as QuestaSim
rtl-tb = ["bsp/rtl-tb"]
# Use this feature when deploying on FPGA
fpga = ["bsp/fpga"]
# Readers use `read` locks instead of plain mutexes on the protected resource
rw = []

# RTIC observability hooks: trace every task activation/completion and resource
# acquire/release, dumped over UART at teardown. Adds a small per-hook cost
# (~0.7%--8% active time) and a slow UART dump (~25 s wall clock in the sim vs
# ~3 s without).
obs = [ "bsp/obs" ]

[profile.dev]
# There seems to be a problem in riscv-rt with regards to linking in default_start_trap in debug
# mode. `codegen-units = 1` avoids that
codegen-units = 1
opt-level = "s"

[profile.release]
# There seems to be a problem in riscv-rt with regards to linking in default_start_trap in debug
# mode. `codegen-units = 1` avoids that
codegen-units = 1
opt-level = "s"

[build-dependencies]
riscv-target-parser = "0.1.3"
