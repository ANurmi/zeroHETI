# A more detailed description of the manifest format `Bender.yml` can be found here:
# https://github.com/pulp-platform/bender#manifest-format-benderyml

package:
  name: zeroHETI
  authors:
  - "Antti Nurmi <antti.nurmi@tuni.fi>"

dependencies:
  rt-ibex: { git: "https://github.com/soc-hub-fi/rt-ibex.git", rev: "ab99b5ee1a077b0a4ae9a5586c8d8311f82cfb54" }
  common_cells: { git: "https://github.com/pulp-platform/common_cells.git", rev: "9ca8a7655f741e7dd5736669a20a301325194c28" } # v1.39.0
  axi: { git: "https://github.com/pulp-platform/axi.git", version: 0.39.11 }
  riscv-dbg: { git: "https://github.com/pulp-platform/riscv-dbg.git", version: 0.8.1 }
  clic: { git: "https://github.com/pulp-platform/clic.git", version: 2.0.0 }
  apb_uart: { git: "https://github.com/pulp-platform/apb_uart.git", version: 0.2.1 }
  apb_spi: { git: "https://github.com/soc-hub-fi/apb_spi.git", version: 0.1.0 }
  apb_timer: { git: "https://github.com/pulp-platform/apb_timer.git", rev: "03eba2e6965f5363df12621882bc70498c551a73" }
  obi: { git: "https://github.com/pulp-platform/obi.git", version: 0.1.7 }
  tq: { git: "https://github.com/ANurmi/TimerQueue.git", version: 0.0.8 }
  edfic: { git: "https://github.com/ANurmi/edfic.git", version: 0.1.0 }
  vbench: { git: "https://github.com/ANurmi/vbench", rev: "main" }
  riscof_verilator: { git: "https://github.com/ANurmi/riscof_verilator.git", version: 0.1.2 }

sources:
- target: zeroheti_pkg
  files:
  - rtl/gen/zeroheti_address_map_pkg.sv
  - rtl/zeroheti_pkg.sv
- target: rtl
  files:
  - rtl/mock_uart.sv
  - rtl/uart_wrapper.sv
  - rtl/i2c_master_bit_ctrl.sv
  - rtl/i2c_master_byte_ctrl.sv
  - rtl/apb_i2c.sv
  - rtl/apb_cfg_regs.sv
  - rtl/apb_mtimer.sv
  - rtl/obi_hetic.sv
  - rtl/obi_mbx.sv
  - rtl/zeroheti_int_ctrl.sv
  - rtl/zeroheti_peripherals.sv
  - rtl/rt_ibex_wrapper.sv
  - rtl/axi_lite_to_mem.sv
  - rtl/axi_lite_sram.sv
  - rtl/obi_to_axi_lite_intf.sv
  - rtl/obi_to_apb_intf.sv
  - rtl/axi_lite_from_mem_intf.sv
  - rtl/irq_arbiter.sv
  - rtl/irq_gateway.sv
  - rtl/zeroheti_dbg_wrapper.sv
  - rtl/zeroheti_core.sv
- target: all(rtl, not(zh_exclude_top))
  files:
  - rtl/zeroheti_top.sv
- target: verilator
  files:
  - verilator/tb/vip/rt_prof_pkg.sv
  - verilator/tb/vip/vip_motor_sim.sv
  - verilator/tb/vip/vip_task_scoreboard.sv
  - verilator/tb/vip/vip_i2c.sv
  - verilator/tb/vip/vip_uart.sv
  - verilator/tb/vip/vip_mbx_driver.sv
  - verilator/tb/vip/vip_zeroheti_top.sv
  - verilator/tb/zeroheti_top_wrapper.sv
- target: fpga
  files:
  - fpga/rtl/prim_clock_gating.sv
  - fpga/rtl/zeroheti_pynq.sv
